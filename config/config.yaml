competition:
	slug: m5-forecasting-accuracy

paths:
	raw_dir: data/raw
	processed_dir: data/processed
	gold_dir: data/gold
	sales_file: sales_train_validation.csv
	calendar_file: calendar.csv

features:
	store_column: store_id
	date_column: date
	target_column: sales
	lags: [1, 7]
	rolling_windows: [7]

split:
	test_days: 28

model:
	n_estimators: 100
	min_samples_leaf: 2
	random_state: 42
